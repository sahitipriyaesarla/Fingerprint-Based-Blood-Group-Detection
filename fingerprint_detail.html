<!doctype html>
<html><head><meta charset="utf-8"><title>Detail</title></head><body>
  <h2>Fingerprint detail</h2>
  <img src="/uploads/{{ image_file }}" style="max-width:320px;">
  <h3>Predicted: {{ predicted_label }}</h3>
  <table border="1">
    <thead><tr><th>Class</th><th>Confidence</th></tr></thead>
    <tbody>
      {% for k, v in confidences.items() %}
        <tr><td>{{ k }}</td><td>{{ '%.2f' % (v * 100) }}%</td></tr>
      {% endfor %}
    </tbody>
  </table>
</body></html>
