<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Probability Graph - Blood Group Detection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root{
      --bg1:#0f2027;
      --bg2:#203a43;
      --bg3:#2c5364;
      --card:#ffffff14;
      --border:#ffffff25;
      --primary:#00e5ff;
      --secondary:#00bcd4;
      --text:#ffffff;
    }

    *{ box-sizing:border-box }

    body{
      margin:0;
      min-height:100vh;
      font-family:"Segoe UI",system-ui,sans-serif;
      background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
      color:var(--text);
      padding:20px;
    }

    .container{
      max-width:1200px;
      margin:0 auto;
    }

    .header{
      text-align:center;
      margin-bottom:30px;
    }

    h1{
      margin-bottom:10px;
      font-size:2rem;
    }

    .back-btn{
      display:inline-block;
      padding:10px 20px;
      background:rgba(255,255,255,0.1);
      border:1px solid rgba(255,255,255,0.2);
      border-radius:10px;
      color:var(--text);
      text-decoration:none;
      margin-bottom:20px;
      transition:all 0.3s ease;
    }

    .back-btn:hover{
      background:rgba(255,255,255,0.2);
    }

    .upload-section{
      background:var(--card);
      backdrop-filter: blur(16px);
      border:1px solid var(--border);
      border-radius:16px;
      padding:30px;
      margin-bottom:30px;
      text-align:center;
    }

    .chart-section{
      background:var(--card);
      backdrop-filter: blur(16px);
      border:1px solid var(--border);
      border-radius:16px;
      padding:30px;
      min-height:400px;
    }

    .file-input-wrapper{
      margin:20px 0;
    }

    .upload-btn, .predict-btn{
      padding:12px 30px;
      border-radius:12px;
      border:none;
      background:linear-gradient(135deg,var(--primary),var(--secondary));
      color:#002b36;
      font-weight:700;
      cursor:pointer;
      margin:10px;
      transition:all 0.3s ease;
    }

    .upload-btn:hover, .predict-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 8px 25px rgba(0,229,255,0.3);
    }

    .upload-btn:disabled, .predict-btn:disabled{
      opacity:0.4;
      cursor:not-allowed;
      transform:none;
    }

    .status{
      margin-top:15px;
      font-weight:600;
    }

    .success{ color:#7CFFB2 }
    .error{ color:#FF8C8C }

    #probChart{
      max-height:400px;
    }

    .chart-container{
      position:relative;
      height:400px;
      margin-top:20px;
    }
  </style>
</head>

<body>

<div class="container">
  <a href="/" class="back-btn">← Back to Dashboard</a>
  
  <div class="header">
    <h1>📊 Probability Graph Analysis</h1>
    <p>Upload a fingerprint to see detailed probability distribution across all blood groups</p>
  </div>

  <div class="upload-section">
    <h3>Upload Fingerprint Image</h3>
    <div class="file-input-wrapper">
      <input id="fileInput" type="file" accept="image/*">
    </div>
    <button id="uploadBtn" class="upload-btn">Upload Image</button>
    <button id="predictBtn" class="predict-btn" disabled>Analyze Probabilities</button>
    <div id="status" class="status"></div>
  </div>

  <div class="chart-section">
    <h3>Probability Distribution</h3>
    <div class="chart-container">
      <canvas id="probChart"></canvas>
    </div>
  </div>
</div>

<script>
const uploadBtn = document.getElementById("uploadBtn");
const predictBtn = document.getElementById("predictBtn");
const fileInput = document.getElementById("fileInput");
const status = document.getElementById("status");

let chart = null;

/* Upload Image */
uploadBtn.onclick = async () => {
  predictBtn.disabled = true;
  status.innerHTML = "";
  if(chart){ chart.destroy(); }

  if(!fileInput.files[0]){
    status.innerHTML = "<span class='error'>Please select an image</span>";
    return;
  }

  const fd = new FormData();
  fd.append("file", fileInput.files[0]);

  uploadBtn.disabled = true;
  uploadBtn.textContent = "Uploading...";

  const res = await fetch("/upload-files", { method:"POST", body:fd });
  const data = await res.json();

  uploadBtn.disabled = false;
  uploadBtn.textContent = "Upload Image";

  status.innerHTML = res.ok
    ? "<span class='success'>Image uploaded successfully</span>"
    : "<span class='error'>" + data.error + "</span>";

  if(res.ok){
    predictBtn.disabled = false;
  }
};

/* Analyze Probabilities */
predictBtn.onclick = async () => {
  status.innerHTML = "Analyzing...";
  predictBtn.disabled = true;

  const res = await fetch("/predict", { method:"POST" });
  const data = await res.json();

  predictBtn.disabled = false;

  if(!res.ok){
    status.innerHTML = "<span class='error'>" + data.error + "</span>";
    return;
  }

  status.innerHTML = "<span class='success'>Analysis complete!</span>";
  drawChart(data.distribution);
};

function drawChart(dist){
  const labels = ["A+","A-","AB+","AB-","B+","B-","O+","O-"];
  const values = labels.map(l => dist[l] || 0);

  if(chart) chart.destroy();

  const ctx = document.getElementById("probChart").getContext("2d");
  chart = new Chart(ctx, {
    type: "bar",
    data: {
      labels: labels,
      datasets: [{
        label: "Probability (%)",
        data: values,
        backgroundColor: [
          "#60a5fa","#93c5fd","#818cf8","#a5b4fc",
          "#34d399","#6ee7b7","#38bdf8","#0ea5e9"
        ],
        borderColor: [
          "#3b82f6","#60a5fa","#6366f1","#8b5cf6",
          "#10b981","#34d399","#0ea5e9","#0284c7"
        ],
        borderWidth: 2,
        borderRadius: 8
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { 
          title: {
            display: true,
            text: 'Blood Group',
            color: '#fff',
            font: { size: 14, weight: 'bold' }
          },
          ticks:{ color:"#fff", font:{ weight:"bold", size:12 }},
          grid: { display: false }
        },
        y: { 
          title: {
            display: true,
            text: 'Percentage (%)',
            color: '#fff',
            font: { size: 14, weight: 'bold' }
          },
          beginAtZero:true, 
          max:100, 
          ticks:{ color:"#fff" },
          grid: { color: "rgba(255,255,255,0.1)" }
        }
      },
      plugins: {
        legend: { 
          labels:{ color:"#fff", font:{ size:14, weight:"bold" }}
        },
        tooltip: {
          callbacks: {
            label: function(context) {
              return context.dataset.label + ': ' + context.parsed.y.toFixed(2) + '%';
            }
          }
        }
      },
      animation: {
        duration: 1500,
        easing: 'easeInOutQuart'
      }
    }
  });
}
</script>

</body>
</html>
